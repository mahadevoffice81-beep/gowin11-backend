<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoWin11 - Admin Dashboard</title>
    <link rel="stylesheet" href="public/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dashboard-body">

    <!-- Sidebar Navigation -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <h2>GoWin11 <span>Admin</span></h2>
        </div>
        <ul class="sidebar-menu">
            <li class="active"><a href="#"><i class="fa-solid fa-chart-line"></i> Dashboard</a></li>
            <li><a href="#"><i class="fa-solid fa-users"></i> Users Management</a></li>
            <li><a href="#"><i class="fa-solid fa-trophy"></i> Sports & Matches</a></li>
            <li><a href="#"><i class="fa-solid fa-gear"></i> Settings</a></li>
            <li><a href="public/index.html" class="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
        </ul>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
        <header class="top-header">
            <h3>Welcome, Admin!</h3>
            <div class="user-profile">
                <span>System Admin</span>
                <i class="fa-solid fa-circle-user"></i>
            </div>
        </header>

        <!-- Stats Grid Cards -->
        <section class="stats-grid">
            <div class="stat-card">
                <i class="fa-solid fa-users card-icon"></i>
                <div>
                    <h4>Total Users</h4>
                    <p class="stat-number">1,250</p>
                </div>
            </div>

            <div class="stat-card">
                <i class="fa-solid fa-signal card-icon"></i>
                <div>
                    <h4>Active Sessions</h4>
                    <p class="stat-number">342</p>
                </div>
            </div>

            <div class="stat-card">
                <i class="fa-solid fa-futbol card-icon"></i>
                <div>
                    <h4>Active Matches</h4>
                    <p class="stat-number">18</p>
                </div>
            </div>
        </section>
    </main>

</body>
</html>
