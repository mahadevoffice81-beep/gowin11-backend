<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gowin11 - Dice Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
        }
        .header {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid #334155;
        }
        .back-btn {
            background: #334155;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }
        .balance-box {
            background: #0f172a;
            padding: 6px 14px;
            border-radius: 8px;
            border: 1px solid #475569;
            font-weight: bold;
            color: #22c55e;
        }
        .game-container {
            width: 100%;
            max-width: 500px;
            background: #1e293b;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        /* Girl Animation Area */
        .dealer-section {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #0f172a;
            padding: 10px 15px;
            border-radius: 12px;
            width: 100%;
            border: 1px solid #334155;
        }
        .dealer-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            animation: pulseAvatar 2s infinite;
        }
        @keyframes pulseAvatar {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.4); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(236, 72, 153, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(236, 72, 153, 0); }
        }
        .dealer-speech {
            font-size: 13px;
            color: #e2e8f0;
            line-height: 1.4;
        }
        /* Dice Board */
        .dice-display {
            font-size: 64px;
            background: #0f172a;
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            border: 2px solid #6366f1;
            box-shadow: inset 0 0 15px rgba(99, 102, 241, 0.2);
        }
        .controls {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .input-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            padding: 10px 15px;
            border-radius: 10px;
            border: 1px solid #334155;
        }
        .input-group input {
            background: transparent;
            border: none;
            color: white;
            font-size: 16px;
            width: 100px;
            text-align: right;
            outline: none;
        }
        .play-btn {
            width: 100%;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .play-btn:active {
            transform: scale(0.98);
        }
        .audio-control {
            font-size: 12px;
            color: #94a3b8;
            cursor: pointer;
            background: none;
            border: none;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="header">
        <a href="../index.html" class="back-btn">← Back</a>
        <h3>Gowin11 Dice</h3>
        <div class="balance-box" id="userBalance">₹1000</div>
    </div>

    <div class="game-container">
        <!-- Dealer Girl Animation & Dialogue -->
        <div class="dealer-section">
            <div class="dealer-avatar">👩‍‍🦰</div>
            <div class="dealer-speech" id="dealerText">
                Hello ji! Dice roll karo aur bada amount jeeto! Good luck! ✨
            </div>
        </div>

        <!-- Dice Box -->
        <div class="dice-display" id="diceBox">🎲</div>

        <!-- Controls -->
        <div class="controls">
            <div class="input-group">
                <span>Bet Amount (₹):</span>
                <input type="number" id="betAmount" value="50" min="10">
            </div>
            <button class="play-btn" onclick="rollDice()">ROLL DICE</button>
        </div>

        <button class="audio-control" onclick="toggleAudio()">🔊 Toggle Background Sound/Music</button>
    </div>

    <div></div> <!-- Spacer -->

    <script>
        // Synchronized Balance Management
        let balance = localStorage.getItem('gowin_balance');
        if (balance === null) {
            balance = 1000;
            localStorage.setItem('gowin_balance', balance);
        } else {
            balance = parseInt(balance);
        }

        function updateDisplay() {
            document.getElementById('userBalance').innerText = '₹' + balance;
            localStorage.setItem('gowin_balance', balance);
        }
        updateDisplay();

        // Audio setup (Web Audio API for sound effects without external files)
        let audioCtx = null;
        let soundEnabled = false;

        function toggleAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            soundEnabled = !soundEnabled;
            alert(soundEnabled ? "Sound Enabled!" : "Sound Disabled!");
        }

        function playSound(type) {
            if (!soundEnabled || !audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'roll') {
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'win') {
                osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        const faces = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
        const dialogues = [
            "Wah! Kya shandar shot hai!",
            "Lagta hai aaj kismat aapke sath hai!",
            "Ek aur jeet ho jaye?",
            "Arre waah, maza aa gaya!"
        ];

        function rollDice() {
            let bet = parseInt(document.getElementById('betAmount').value);
            if (isNaN(bet) || bet <= 0) {
                alert("Kripya sahi bet amount dalein!");
                return;
            }
            if (bet > balance) {
                alert("Aapke paas पर्याप्त balance nahi hai!");
                return;
            }

            balance -= bet;
            updateDisplay();
            playSound('roll');

            let diceBox = document.getElementById('diceBox');
            let dealerText = document.getElementById('dealerText');
            
            // Rolling animation effect
            let counter = 0;
            let rollInterval = setInterval(() => {
                let randomFace = Math.floor(Math.random() * 6);
                diceBox.innerText = faces[randomFace];
                counter++;
                if (counter > 10) {
                    clearInterval(rollInterval);
                    
                    // Final Result calculation
                    let finalRoll = Math.floor(Math.random() * 6);
                    diceBox.innerText = faces[finalRoll];

                    if (finalRoll >= 3) {
                        let winAmount = bet * 2;
                        balance += winAmount;
                        updateDisplay();
                        playSound('win');
                        dealerText.innerText = "🎉 Jeet gaye! " + winAmount + " coins aapke account mein jud gaye!";
                    } else {
                        let randomDialogue = dialogues[Math.floor(Math.random() * dialogues.length)];
                        dealerText.innerText = "😢 Oh no! Haar gaye. " + randomDialogue;
                    }
                }
            }, 50);
        }
    </script>
</body>
</html>
